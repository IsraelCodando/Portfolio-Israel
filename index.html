/* ===== IRAS: variaveis de tema ===== */
:root{--soft:#cdd4f5;--panel:#0d1230;--on-accent:#04121a;--chip-bg:#8b5cf633;--chip-fg:#c4b5fd;--chip-bd:#8b5cf666;--chip-fg2:#e0d7ff;--glow-a:rgba(139,92,246,.28);--glow-b:rgba(34,211,238,.16);--accent-shadow:#22d3ee40;--glass:rgba(38,35,46,.66);--glass-edge:rgba(255,255,255,.1);--glass-shadow:0 22px 44px -20px rgba(0,0,0,.8),0 6px 16px -8px rgba(0,0,0,.5)}
html[data-theme=light]{--bg:#ffffff;--bg-2:#f2f4fa;--text:#12172b;--muted:#566079;--accent:#0e7490;--accent-2:#7c3aed;--card:rgba(18,23,43,.035);--border:rgba(18,23,43,.13);color-scheme:light;--soft:#363e5c;--panel:#ffffff;--on-accent:#ffffff;--chip-bg:rgba(124,58,237,.1);--chip-fg:#6d28d9;--chip-bd:rgba(124,58,237,.3);--chip-fg2:#5b21b6;--glow-a:rgba(124,58,237,.1);--glow-b:rgba(14,116,144,.11);--accent-shadow:rgba(14,116,144,.3);--glass:rgba(240,240,243,.82);--glass-edge:rgba(24,24,27,.1);--glass-shadow:0 22px 44px -22px rgba(24,24,27,.3),0 6px 16px -10px rgba(24,24,27,.16)}
html[data-theme=cozy]{--bg:#1b1310;--bg-2:#2b1d16;--text:#f7ebdb;--muted:#c9b097;--accent:#f2a65a;--accent-2:#e07a5f;--card:rgba(255,226,190,.06);--border:rgba(255,222,185,.16);color-scheme:dark;--soft:#ead9c3;--panel:#2a1c15;--on-accent:#2a140a;--chip-bg:rgba(224,122,95,.2);--chip-fg:#ffc2a8;--chip-bd:rgba(224,122,95,.45);--chip-fg2:#ffd9c7;--glow-a:rgba(224,122,95,.28);--glow-b:rgba(242,166,90,.16);--accent-shadow:rgba(242,166,90,.32);--glass:rgba(62,42,32,.74);--glass-edge:rgba(255,222,185,.16);--glass-shadow:0 22px 44px -20px rgba(20,8,0,.75),0 6px 16px -8px rgba(20,8,0,.45)}
html[data-theme=cozy] h1,html[data-theme=cozy] h2,html[data-theme=cozy] h3,html[data-theme=cozy] .about-box h4{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
html[data-theme=cozy] .btn,html[data-theme=cozy] .chip,html[data-theme=cozy] .stack li{letter-spacing:.01em}
body{transition:background-color .3s,color .3s}
.space{background:radial-gradient(60% 50% at 80% 0%,var(--glow-a),transparent 70%),radial-gradient(50% 40% at 0% 100%,var(--glow-b),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg-2))}
.about__text p,.about-box p,.about-box li{color:var(--soft)}
.about-box .about-lead,.about-box li b{color:var(--text)}
.about-box{background:var(--panel)}
.chip{background:var(--chip-bg);color:var(--chip-fg)}
.about-box ul.about-tech li{background:var(--chip-bg);border-color:var(--chip-bd);color:var(--chip-fg2)}
.btn--primary,.btn--small,.tab.is-active{color:var(--on-accent)}
.btn--primary{box-shadow:0 8px 30px var(--accent-shadow)}
.about-stats div{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,transparent),color-mix(in srgb,var(--accent-2) 14%,transparent))}
.cert-box button{color:#fff}
.about-box .about-x{color:var(--text);background:var(--card)}
/* ===== cabecalho flutuante (PillNav) ===== */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;flex-wrap:wrap;gap:12px;justify-content:space-between;padding:12px clamp(16px,4vw,48px);background:none;border-bottom:0;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}
.topbar>*{pointer-events:auto}
.nav-wrap{flex:1 1 360px;min-width:0;display:flex;align-items:center;pointer-events:none}
.nav-wrap>*{pointer-events:auto}
.nav-wrap .pill-nav__mark{color:var(--accent)}
.topbar__tools{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.topbar__tools .btn--small{height:44px;padding:0 18px;box-shadow:var(--glass-shadow);white-space:nowrap}
.controls{display:flex;align-items:center;gap:4px;height:44px;padding:4px;box-sizing:border-box;border-radius:999px;background:var(--glass);box-shadow:var(--glass-shadow),inset 0 0 0 1px var(--glass-edge);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
.seg{display:flex;gap:2px}
.seg__btn{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.05em;transition:background .2s,color .2s}
.seg__btn:hover{color:var(--text)}
.seg__btn.is-on{background:var(--accent);color:var(--on-accent)}
.seg__btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg__btn svg{width:18px;height:18px}
.controls__sep{width:1px;height:20px;background:var(--border)}
@media(max-width:720px){.nav-wrap{order:2;flex:1 1 100%}.topbar__tools{order:1;flex:1 1 100%;justify-content:space-between}.topbar__tools .btn--small{padding:0 14px;font-size:.85rem}.topbar{gap:8px;padding-top:10px}}
@media(max-width:400px){.topbar__tools .btn--small{display:none}.topbar__tools{justify-content:flex-end}}
/* ===== skills agrupadas, disponibilidade, skip link ===== */
.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.skillgroup h3{font-size:.95rem;margin:0 0 12px;color:var(--text)}
.skillgroup ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.skill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:.9rem;line-height:1.2}
.skill__ic{display:inline-flex;font-size:1.15rem}
.skill__ic svg{width:1em;height:1em}
.skill small{margin-left:6px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.avail{margin-top:36px}
.avail h3{font-size:1.2rem;margin:0 0 14px}
.avail .facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.skip{position:absolute;left:12px;top:-60px;z-index:20;padding:10px 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.hero__badge:has(.hero__card){height:auto;display:flex;justify-content:center;align-items:center}
</style>

space:{eyebrow:"Own project",title:"Space Prospects",
lead:"I built a tool that finds businesses that need a website and connects sellers with them.",
story:["It all began with a simple idea: there are plenty of good businesses, with customers and an active WhatsApp, that still don't have a website. And people who sell websites usually spend hours hunting for these companies one by one, without knowing if they're worth contacting.","I created Space Prospects to solve that: find the right contacts and already deliver everything needed to approach them."],
stats:[["+350","searches already run on the platform"],["Recurring","payments already received from sales"],["Profit","generated by the project itself"]],
h:"What it does",
items:[["Search by niche and city.","Cross-references Google Maps and Instagram and returns only active businesses that have no website."],["Filters that make a difference.","Highly rated businesses, or ones that only have WhatsApp and no website: the most promising contacts."],["Understands the customer's pain.","Shows what that business loses by not having a website, so the conversation starts with a real reason instead of a generic text."],["Ready-made outreach message.","Already written and ready to send on WhatsApp."],["AI-built sample website.","Creates the company's website as a demo, to show the result instead of just promising it."],["Organization and metrics.","Each contact gets a score from 0 to 100 and enters a Kanban-style funnel, with a tracking dashboard."],["And more.","Referral program, subscriptions, Portuguese and English, and 3 free searches to try it out."]],
techH:"How it was built",
tech:["TypeScript","Next.js 14","React","Tailwind CSS","Supabase","PostgreSQL","Google and Apify APIs","AI (Groq)"],
techP:"The database is PostgreSQL on Supabase, with 22 tables (searches, contacts, analyses, subscriptions, referrals and more) and row-level security, so each user sees only their own data. In total there are over 50 thousand lines of code, written in TypeScript.",
whyH:"Why it matters to me",
why:"It didn't stay just an idea: Space Prospects left the drawing board, has already made me a profit and I've already received recurring payments from its sales. I built it from scratch, combining programming, databases, artificial intelligence, customer understanding and sales. It was with it that I learned, in practice, that technology is only worth it when it solves a real problem.",

jornal:{eyebrow:"Capstone project (TCC) \u00b7 in development",title:"Jornal Escolar",
lead:"I built a newspaper so the school can talk to everyone at once, instead of messaging group by group.",
story:["The idea came from an everyday school situation: the principal has to send the same notice to one group of parents, then another, then the students. It's work, it's repetitive and tiring.","I thought: what if there were a single place, nice and easy to access, where everything happening at school showed up organized? That's how Jornal Escolar (the School Newspaper) was born, which I'm building as my TCC. It's not finished yet, but it's already online and already shows where it's going."],
stats:[["TCC","my school's capstone project"],["5 sections","news, sports, school, culture and events"],["Live","still under construction, already working"]],
h:"What it has today",
items:[["A real newspaper homepage.","Headline of the day, latest news scrolling at the top, school highlights and the most-read stories."],["News by section.","Sports, school, culture and events, each with its own page, plus a search to find what you need."],["User accounts.","Sign-up and login for anyone who wants to take part."],["Moderator dashboard.","A restricted area to track registered users and manage the site's news."],["Details that make it feel alive.","Today's date, S\u00e3o Paulo's temperature updated live and a light or dark theme, whichever the person prefers."]],
techH:"How it was built",
tech:["HTML","CSS","JavaScript","Firebase Authentication","Cloud Firestore","Open-Meteo API","Vercel"],
techP:"Built with plain HTML, CSS and JavaScript, no framework. Login uses Firebase Authentication and the data lives in Cloud Firestore, a cloud database. The temperature comes from a public weather forecast API and the site is hosted on Vercel.",
whyH:"Why it matters to me",
why:"Here I turned an everyday problem at my school into a product: a site designed to be clear, fast and easy for both readers and publishers.",
nextH:"What's next?",next:"The project still needs to be finished. The goal is to see the whole school using the newspaper for announcements and save time for the people who now send everything group by group.",
url:"https://jornalescolar-self.vercel.app/",cta:"Open Jornal Escolar"}};
